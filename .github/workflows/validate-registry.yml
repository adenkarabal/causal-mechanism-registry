name: Validate registry
# SPDX-License-Identifier: MIT

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  registry:
    name: Registry integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate registry structure, cross-references, and generated documentation
        run: ruby scripts/validate_registry.rb
      - name: Confirm MECHANISMS.md is generated from the registry
        run: ruby scripts/build_mechanisms_md.rb --check

  schema:
    name: Schema conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator
        run: python -m pip install --disable-pip-version-check --quiet jsonschema
      - name: Validate the registry against the published JSON Schema
        run: python3 scripts/validate_schema.py

  citation:
    name: Citation metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate CITATION.cff
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: "--validate"
